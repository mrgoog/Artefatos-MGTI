[project]
name = "rag2"
version = "0.1.0"
description = "Protótipo RAG-2: recuperação e prompts para o BR-TaxQA-R"
requires-python = ">=3.12"
dependencies = [
    "ensemble-llm",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scipy>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.0",
]

[project.scripts]
rag2 = "rag2.cli:main"

[tool.uv.sources]
ensemble-llm = { path = "..", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.2",
    "python-docx>=1.2.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gpu: exige CUDA e o embedder/reranker (pula sem GPU)",
    "llm: exige llama-swap local ou a API do juiz",
    "lento: leva mais de um minuto",
]

[tool.ruff]
line-length = 100
target-version = "py312"
