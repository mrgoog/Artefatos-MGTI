# Fase 2 — Experimento completo com agentes locais via llama-swap
#
# Objetivo: rodar o protocolo experimental do artigo nos 715 itens do BR-TaxQA-R,
# com três agentes open-weights executando em GPUs locais e o juiz frontier
# mantido via OpenRouter (única dependência externa paga).
#
# Pré-requisitos antes de rodar:
#   1) llama-swap rodando em http://localhost:8080
#   2) Modelos abaixo disponíveis no endpoint /v1/models:
#        qwen3.5-9b
#        granite4.1-8b
#        gemma4-e4b
#   3) `validar_config_experimento` rodado para conferir que todos os modelos
#      respondem antes de iniciar a execução completa.
#
# Custo esperado:
#   - Agentes: 715 × 3 = 2.145 invocações locais (custo zero, horas de GPU)
#   - Juiz:    ~2.145 chamadas ao OpenRouter (~$8-15 dependendo do modelo)

experiment_id: phase2_local_full_715
phase: phase2_local_full
sample_size: null  # null = dataset completo (715 itens); número = amostra estratificada
parallel_agents: false  # ver Princípio 5 do CLAUDE.md sobre paralelização

dataset:
  dataset_id: brtaxq_2024_v1_1
  format: brtaxqa_compatible
  root_dir: data/brtaxq
  questions_file: questions_QA_2024_v1.1.json
  corpus_files:
    - referred_legal_documents_QA_2024_v1.1.json
    - acordaos_CARF_2023.json

agents:
  # Modelos definidos para Fase 2 via llama-swap.

  - agent_id: qwen35_9b
    backend: llama-swap
    model: qwen3.5-9b
    temperature: 0.0
    max_tokens: 1024
    seed: 42
    host: http://localhost:8080

  - agent_id: granite41_8b
    backend: llama-swap
    model: granite4.1-8b
    temperature: 0.0
    max_tokens: 1024
    seed: 42
    host: http://localhost:8080

  - agent_id: gemma4_e4b
    backend: llama-swap
    model: gemma4-e4b
    temperature: 0.0
    max_tokens: 1024
    seed: 42
    host: http://localhost:8080

judge:
  judge_id: judge_main
  backend: openrouter
  model: openai/gpt-5.4-mini
  temperature: 0.0
  max_tokens: 1024
  seed: 42

retrieval:
  embedder_model: BAAI/bge-m3
  embedder_device: cuda:0
  embedder_batch_size: 8
  persisted_index_dir: runs/_shared/rag/br_taxqa_r_bge-m3_cuda1
  chunk_max_tokens: 512
  chunk_overlap_tokens: 64
  dense_top_k: 5
  bm25_top_k: 5
  merge_strategy: union_dedup

partition:
  # Para a Fase 2 com 715 itens, K=10 conforme protocolo do artigo (Seção 5.2)
  n_splits: 10
  n_val_folds: 2
  stratify_by: has_doc_ref

decision:
  c_min_grid: [0.5, 0.7, 0.8, 0.9]
  tiebreak_strategy: highest_weight

bootstrap:
  n_resamples: 10000   # Hesterberg (2015) — ver decisoes_metodologicas.md
  confidence_level: 0.95
  method: BCa
  seed: 42
