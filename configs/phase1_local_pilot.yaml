# Fase 1 — Piloto local via llama-swap
# Objetivo: validar pipeline com sample_size questões aleatórias.

experiment_id: phase1_local_pilot_200_1
phase: phase1_api_pilot
sample_size: 200
parallel_agents: false

dataset:
  dataset_id: brtaxq_2024_v1_1
  format: brtaxqa_compatible
  root_dir: data/brtaxq
  questions_file: questions_QA_2024_v1.1.json
  corpus_files:
    - referred_legal_documents_QA_2024_v1.1.json
    - acordaos_CARF_2023.json

agents:
  - agent_id: qwen35_9b
    backend: llama-swap
    model: qwen3.5-9b
    temperature: 0.0
    max_tokens: 2048
    seed: 42
    host: http://localhost:8080

  - agent_id: granite41_8b
    backend: llama-swap
    model: granite4.1-8b
    temperature: 0.0
    max_tokens: 2048
    seed: 42
    host: http://localhost:8080

  - agent_id: gemma4_e4b
    backend: llama-swap
    model: gemma4-e4b
    temperature: 0.0
    max_tokens: 2048
    seed: 42
    host: http://localhost:8080

judge:
  judge_id: judge_main
  backend: openrouter
  model: openai/gpt-5.4-mini
  temperature: 0.0
  max_tokens: 2048
  seed: 42

retrieval:
  embedder_model: BAAI/bge-m3
  embedder_device: cuda:0
  embedder_batch_size: 8
  persisted_index_dir: runs/_shared/rag/br_taxqa_r_bge-m3_cuda1
  chunk_max_tokens: 512
  chunk_overlap_tokens: 64
  dense_top_k: 10
  bm25_top_k: 10
  merge_strategy: union_dedup

partition:
  # Para a fase piloto com 25 itens, K menor:
  n_splits: 5
  n_val_folds: 1
  stratify_by: has_doc_ref

decision:
  c_min_grid: [0.7, 0.9]
  tiebreak_strategy: highest_weight

bootstrap:
  n_resamples: 10000
  confidence_level: 0.95
  method: BCa
  seed: 42
