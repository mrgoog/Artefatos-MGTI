[project]
name = "ensemble-llm"
version = "0.1.0"
description = "Ensemble local de LLMs open-weights com calibração de confiança e abstenção seletiva"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "André L. C. Magoga" },
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.4",
    "pyarrow>=15.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=8.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "datasets>=2.20",
    "structlog>=24.1",
    "matplotlib>=3.10.9",
    "openpyxl>=3.1.5",
    "streamlit>=1.62.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ensemble_llm"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "hypothesis>=6.100",
    "tabulate>=0.10.0",
    "python-pptx>=1.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
